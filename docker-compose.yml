version: '3.9'

services:

  api: 
    command: >
      sh -c "uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    build: .
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TZ: America/Lima
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: db_prod
    environment:
      MYSQL_ROOT_PASSWORD: rootpass159
      MYSQL_DATABASE: not_system
      MYSQL_USER: dani
      MYSQL_PASSWORD: pass159pow
      TZ: America/Lima
      UV_NO_DEV: 1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/docker/init:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data: